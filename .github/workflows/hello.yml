
name: GitHub Actions Practical

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  hello-job:
    name: Run Hello Job
    runs-on: ubuntu-latest

    steps:
      - name: Display greeting
        run: echo "Hello Ashish! My first GitHub Actions workflow is running."

      - name: Display date
        run: date

      - name: Verify repository secret
        env:
          PRACTICAL_MESSAGE: ${{ secrets.PRACTICAL_MESSAGE }}
        run: |
          if [ -z "$PRACTICAL_MESSAGE" ]; then
            echo "Secret is missing."
            exit 1
          fi
          echo "Repository secret is configured and available."
